name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.read_ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install 3.14
      
      - name: Install dependencies
        run: uv sync --extra dev
      
      - name: Format check
        run: uv run ruff format --check .
      
      - name: Lint
        run: uv run ruff check .
      
      - name: Type check
        run: uv run mypy --install-types --non-interactive src/warp_jira_agent
