[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "warp-jira-agent"
authors = [
  { name = "Warp Team", email = "dev@warp.dev" }
]
version = "0.0.0"
description = "Jira integration for using Warp's agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jira>=3.8.0",
    "pyyaml>=6.0.0",
    "warp-agent-sdk>=0.2.0",
]

[project.scripts]
warp-jira-agent = "warp_jira_agent.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["warp_jira_agent"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
